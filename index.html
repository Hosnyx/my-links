<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(-45deg,#0f172a,#1e293b,#111827,#020617);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.card{
    width:100%;
    max-width:450px;
    padding:35px;
    border-radius:30px;
    text-align:center;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 20px 40px rgba(0,0,0,.4);
}

.logo{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid rgba(255,255,255,.2);
    margin-bottom:15px;
}

h1{
    color:#fff;
    font-size:30px;
    margin-bottom:10px;
}

.desc{
    color:#cbd5e1;
    margin-bottom:30px;
    line-height:1.8;
}

.links{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.btn{
    text-decoration:none;
    color:white;
    padding:14px 18px;
    border-radius:18px;
    display:flex;
    align-items:center;
    gap:15px;
    font-size:17px;
    font-weight:700;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-4px) scale(1.02);
}

.btn i{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#fff;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    flex-shrink:0;
}

.btn span{
    flex:1;
    text-align:center;
    margin-left:48px;
}

.facebook{
    background:linear-gradient(135deg,#1877f2,#0d47a1);
}

.instagram{
    background:linear-gradient(135deg,#ff0069,#ff7a00);
}

.tiktok{
    background:linear-gradient(135deg,#000,#333);
}

.whatsapp{
    background:linear-gradient(135deg,#25d366,#128c7e);
}

.youtube{
    background:linear-gradient(135deg,#ff0000,#c62828);
}

.website{
    background:linear-gradient(135deg,#7c3aed,#4f46e5);
}

.cv{
    background:linear-gradient(135deg,#f59e0b,#d97706);
}    
    
.footer{
    margin-top:25px;
    color:#94a3b8;
    font-size:13px;
}

.designer{
    display:inline-block;
    margin-top:12px;
    text-decoration:none;
    font-size:16px;
    font-weight:700;
    color:#FFD700;
    transition:all .3s ease;
    text-shadow:0 0 10px rgba(255,215,0,.7);
}

.designer:hover{
    color:#ffffff;
    transform:scale(1.08);
    text-shadow:
        0 0 10px #FFD700,
        0 0 20px #FFD700,
        0 0 30px #FFD700;
}
</style>

</head>
